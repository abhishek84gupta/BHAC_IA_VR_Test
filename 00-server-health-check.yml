---
# Playbook: Get Service Status
# Purpose: Check status of a specific service on a target host
#
# Example Inputs:
# {
#   "target_host": "bcx-pun-fc649a5.bmc.com",
#   "service_name": "remote-restapi-plugin"
# }

# Play 1: Add target host to runtime inventory
- name: Initialize target host
  hosts: localhost
  gather_facts: no
  connection: local

  tasks:
    - name: Validate target_host is provided
      fail:
        msg: "target_host is required"
      when: target_host is not defined or target_host == ""

    - name: Validate service_name is provided
      fail:
        msg: "service_name is required"
      when: service_name is not defined or service_name == ""

    - name: Add target host to runtime inventory
      add_host:
        name: "{{ target_host }}"
        groups: target_servers
        ansible_host: "{{ target_host }}"
        ansible_user: "{{ ansible_user | default(omit) }}"
        ansible_password: "{{ ansible_password | default(omit) }}"
        ansible_port: "{{ ansible_port | default(22) }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
        ansible_connection: "{{ 'local' if target_host in ['localhost', '127.0.0.1'] else 'ssh' }}"

# Play 2: Check service status
- name: Check service status
  hosts: target_servers
  gather_facts: yes
  become: yes

  tasks:
    - name: Get service state
      shell: |
        systemctl is-active {{ service_name }}
      register: service_active
      changed_when: false
      failed_when: false

    - name: Get service enabled state
      shell: |
        systemctl is-enabled {{ service_name }}
      register: service_enabled
      changed_when: false
      failed_when: false

    - name: Get service details
      shell: |
        systemctl status {{ service_name }} --no-pager -l | head -30
      register: service_status
      changed_when: false
      failed_when: false

    - name: Export service status
      set_stats:
        data:
          result: |
            SERVICE STATUS SUMMARY

            Host: {{ inventory_hostname }}
            Service: {{ service_name }}

            Active State: {{ service_active.stdout | default('unknown') }}
            Enabled State: {{ service_enabled.stdout | default('unknown') }}

            Service Details:
            {{ service_status.stdout | default('No status available') }}

            Status: SUCCESS
        aggregate: no
        per_host: no
